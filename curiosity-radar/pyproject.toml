[project]
name = "curiosity-radar"
version = "0.1.0"
description = "Agent Skill: analyze Wikipedia pageview trends across languages to inform topic/audience decisions."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "fpdf2>=2.7",
  "weasyprint>=62.0",
]

[project.scripts]
curiosity-radar = "curiosity_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curiosity_radar"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `typer.Option(...)` in argument defaults, which is typer's
# documented, required usage pattern for declaring CLI options.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/curiosity_radar"]
ignore_missing_imports = true
