<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "ReportSans"; src: url("$font_regular"); font-weight: normal; }
  @font-face { font-family: "ReportSans"; src: url("$font_bold"); font-weight: bold; }
  @page { size: A4; margin: 12mm; }
  body { font-family: "ReportSans", sans-serif; font-size: 9pt; color: #111; }
  h1 { font-size: 15pt; margin: 0 0 2mm 0; }
  .meta { font-size: 8pt; color: #444; margin: 0 0 1mm 0; }
  .truncation { color: #a00; font-size: 8pt; }
  .headline { font-weight: bold; font-size: 10pt; margin: 3mm 0; }
  .audience-note { font-style: italic; font-size: 8pt; color: #555; }
  .charts { display: flex; flex-wrap: wrap; gap: 2mm; margin: 2mm 0; }
  .charts img { width: 48%; }
  h2 { font-size: 10pt; margin: 3mm 0 1mm 0; border-bottom: 0.4pt solid #999; }
  .claims { font-family: "ReportSans", monospace; font-size: 7pt; line-height: 1.35; white-space: pre-wrap; }
  .ranking div, .assumptions, .limitations { font-size: 7.5pt; line-height: 1.4; }
  .assumptions, .limitations { background: #f4f4f4; padding: 1.5mm 2mm; margin: 1mm 0; }
  footer { position: fixed; bottom: 0; font-size: 7pt; font-style: italic; color: #333; }
</style>
</head>
<body>
$body
<footer>Numeric claims verified against source data: PASS</footer>
</body>
</html>
